name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build and test
        run: npm test

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: rainclassroom-ai-dist
          path: dist/
          if-no-files-found: error
