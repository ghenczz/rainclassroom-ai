<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>长江雨课堂 AI 学习助手</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-course" viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" />
        <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20" />
        <path d="M8 7h8M8 11h5" />
      </symbol>
      <symbol id="icon-video" viewBox="0 0 24 24">
        <rect x="3" y="5.5" width="18" height="13" rx="3" />
        <path d="m10 9.5 4.5 2.5L10 14.5v-5Z" />
      </symbol>
      <symbol id="icon-chat" viewBox="0 0 24 24">
        <path d="M21 11.5a8.5 8.5 0 0 1-12.8 7.4L4 20l1.2-3.8A8.5 8.5 0 1 1 21 11.5Z" />
        <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" />
      </symbol>
      <symbol id="icon-questions" viewBox="0 0 24 24">
        <rect x="5" y="4" width="14" height="17" rx="3" />
        <path d="M9 4.5v-.7A1.8 1.8 0 0 1 10.8 2h2.4A1.8 1.8 0 0 1 15 3.8v.7" />
        <path d="m8.5 12 2 2 4-4" />
      </symbol>
      <symbol id="icon-mistakes" viewBox="0 0 24 24">
        <path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-3.5L6 21V4.8Z" />
        <path d="m9.5 8.5 5 5M14.5 8.5l-5 5" />
      </symbol>
      <symbol id="icon-history" viewBox="0 0 24 24">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5" />
        <path d="M3.5 4v4.5H8" />
        <path d="M12 7.5V12l3 2" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
        <circle cx="16" cy="7" r="2" />
        <circle cx="8" cy="17" r="2" />
      </symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3Z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 1 0-2.3 6.7" />
        <path d="M20 4v7h-7" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7" />
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="m12 3 1.4 4.1a5.4 5.4 0 0 0 3.5 3.5L21 12l-4.1 1.4a5.4 5.4 0 0 0-3.5 3.5L12 21l-1.4-4.1a5.4 5.4 0 0 0-3.5-3.5L3 12l4.1-1.4a5.4 5.4 0 0 0 3.5-3.5L12 3Z" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="rail">
        <div class="brand" title="长江雨课堂 AI 学习助手">
          <span class="brand-mark">雨</span>
          <span class="brand-glow" aria-hidden="true"></span>
        </div>

        <nav class="rail-nav" aria-label="功能导航">
          <button
            class="rail-item is-active"
            type="button"
            data-view="course"
            aria-current="page"
            title="当前课程"
          >
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-course"></use></svg>
            <span>课程</span>
          </button>
          <button class="rail-item" type="button" data-view="video" title="视频学习">
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-video"></use></svg>
            <span>视频</span>
          </button>
          <button class="rail-item" type="button" data-view="chat" title="AI 问答">
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-chat"></use></svg>
            <span>问答</span>
          </button>
          <button class="rail-item" type="button" data-view="questions" title="题目分析">
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-questions"></use></svg>
            <span>题目</span>
          </button>
          <button class="rail-item" type="button" data-view="mistakes" title="错题记录">
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-mistakes"></use></svg>
            <span>错题</span>
          </button>
          <button class="rail-item" type="button" data-view="history" title="学习历史">
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-history"></use></svg>
            <span>历史</span>
          </button>
          <button class="rail-item" type="button" data-view="settings" title="API 设置">
            <svg class="rail-icon" aria-hidden="true"><use href="#icon-settings"></use></svg>
            <span>设置</span>
          </button>
        </nav>

        <div class="rail-meta" title="本地 API 配置状态">
          <span class="status-dot" id="api-dot" aria-hidden="true"></span>
          <span id="api-label">API 未配置</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="topbar-copy">
            <p class="eyebrow" id="view-kicker">学习空间</p>
            <h1 id="view-title">当前课程</h1>
          </div>
          <div class="topbar-actions">
            <span class="phase-pill">第五阶段</span>
            <button
              class="icon-button"
              id="refresh-button"
              type="button"
              title="刷新本地状态"
              aria-label="刷新本地状态"
            >
              <svg class="button-icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
            </button>
          </div>
        </header>

        <div class="content" id="content"></div>

        <footer class="panel-footer">
          <span class="footer-dot" aria-hidden="true"></span>
          <span>数据仅保存在本机</span>
          <span class="footer-version" id="version-label"></span>
        </footer>
      </main>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
